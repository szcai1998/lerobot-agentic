[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-agentic"
version = "0.1.0"
description = "Embodied AI manipulation engine pairing Gemini Robotics Embodied Reasoning with Hugging Face LeRobot ACT/SmolVLA policies and DeepMind MuJoCo simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "szcai1998"}
]
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "mujoco>=3.2.0",
    "google-genai>=2.3.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "opencv-python-headless>=4.8.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.9",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
lerobot = [
    "lerobot>=0.4.0,<0.6.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "huggingface-hub>=0.25.0",
]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
